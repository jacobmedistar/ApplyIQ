<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator setup · ApplyIQ</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><a class="brand" href="/">ApplyIQ</a><nav aria-label="Workspace"><a href="/staff.html">Staff sign-in</a></nav></aside>
<main><section id="view"><h1>Set up the first administrator</h1>
<form class="form panel" id="setup">
<label class="wide">Setup key<input name="key" type="password" autocomplete="off" required></label>
<label>Email<input name="email" type="email" autocomplete="username" required></label>
<label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
<div class="wide"><button class="primary">Create administrator</button></div>
</form><p id="setup-status" role="status"></p><a href="/staff.html">Go to staff sign-in</a>
</section></main><script type="module" src="/setup.js"></script></body>
</html>
